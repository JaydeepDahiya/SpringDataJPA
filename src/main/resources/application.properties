# Show SQL - at higher Boot level
# spring.jpa.show-sql=true

# Or use the below
# Show SQL - at lower Hibernate level. Use this if using other hibernate properties as well
spring.jpa.properties.hibernate.show_sql=true

#Format SQL
spring.jpa.properties.hibernate.format_sql=true

#Show bind values
# Pre Spring Boot 3.0.2
# logging.level.org.hibernate.type.descriptor.sql=trace
# Spring Boot 3.0.2+
logging.level.org.hibernate.type.descriptor.sql=trace

# Enable H2 console
spring.h2.console.enabled=true

# NOTE: H2-console dependency isn't mandatory for Spring Boot 3.0.2+. It is included in spring-boot-starter-data-jpa
# dependency and using this property enables the console. If you are using Spring Boot 2.x, you need to add the
# dependency explicitly in your pom.xml or build.gradle file.

# NOTE: The H2 console is available at http://localhost:8080/h2-console. The default username is "sa" and the password
# is empty. You can change these settings in the application.properties file if needed.