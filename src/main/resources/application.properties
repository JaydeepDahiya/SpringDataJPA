# NOTE: all properties below will be used for all profiles unless overridden in profile-specific properties files (e.g., application-local.properties)

# Show SQL - at higher Boot level
# spring.jpa.show-sql=true

# Or use the below
# Show SQL - at lower Hibernate level. Use this if using other hibernate properties as well
spring.jpa.properties.hibernate.show_sql=true

#Format SQL
spring.jpa.properties.hibernate.format_sql=true

#Show bind values
# Pre Spring Boot 3.0.2
# logging.level.org.hibernate.type.descriptor.sql=trace
# Spring Boot 3.0.2+
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Enable H2 console
spring.h2.console.enabled=true
# NOTE: H2-console dependency isn't mandatory for Spring Boot 3 but is required for Spring Boot 2 as well as 4

# To disable the warning about database queries during view rendering
# spring.jpa.open-in-view is enabled by default. Therefore, database queries may be performed during view rendering. Explicitly configure spring.jpa.open-in-view to disable this warning
spring.jpa.open-in-view=false

# H2 Database Configuration
# DB_CLOSE_DELAY=-1 - Use an in-memory database that doesn't close when the last connection is closed
# DB_CLOSE_ON_EXIT=FALSE - Prevent the database from closing when the JVM exits
# MODE=MYSQL - Use MySQL compatibility mode for H2 database
# DATABASE_TO_LOWER=TRUE - Store database identifiers in lowercase to avoid case sensitivity issues
# CASE_INSENSITIVE_IDENTIFIERS=TRUE - Make database identifiers case-insensitive to avoid issues with case sensitivity
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=password

# MySQL Database Configuration
spring.jpa.database=mysql
# telling hibernate to use mysql specific commands
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false

spring.liquibase.change-log=db/changelog/changelog-master.xml