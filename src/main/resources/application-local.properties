# NOTE: properties below will override the properties in application.properties rest will be taken from application.properties

spring.datasource.username=bookadmin
spring.datasource.password=password
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bookdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.jpa.hibernate.ddl-auto=validate

spring.sql.init.mode=always

# to remove warning - HHH90000021: Encountered deprecated setting [javax.persistence.sharedCache.mode], use [jakarta.persistence.sharedCache.mode] instead
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE
